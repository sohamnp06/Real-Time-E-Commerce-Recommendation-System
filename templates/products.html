{% extends "layout.html" %}

{% block content %}

<h2>Recommended Products</h2>

<button onclick="location.reload()" class="refresh-btn">
Refresh Products
</button>

<button onclick="toggleFilter()" class="filter-btn">
Filter Products
</button>

<div id="filterBox" style="display:none">

<form action="/recommend" method="POST">

<label>Category</label>

<select name="category" id="category" onchange="updateSubCategories()">

<option value="">Select Category</option>
<option value="Office Supplies">Office Supplies</option>
<option value="Furniture">Furniture</option>
<option value="Technology">Technology</option>

</select>

<br><br>

<label>Sub Category</label>

<select name="sub_category" id="sub_category">
<option value="">Select Sub Category</option>
</select>

<br><br>

<button type="submit">Get Recommendations</button>

</form>

</div>


<div class="product-grid">

{% for product in products %}

<div class="card">

<img src="{{ url_for('static', filename='images/product.png') }}">

<p>{{ product[1] }}</p>

<p class="price">₹ {{ "%.2f"|format(product[2]) }}</p>

<button onclick="addToCart('{{ product[0] }}')">
Add to Cart
</button>

</div>

{% endfor %}

</div>


<script>

function toggleFilter(){

var box=document.getElementById("filterBox");

if(box.style.display==="none"){
box.style.display="block";
}
else{
box.style.display="none";
}

}


function updateSubCategories(){

var category=document.getElementById("category").value;
var subCategory=document.getElementById("sub_category");

subCategory.innerHTML="";

var options=[];

if(category==="Office Supplies"){
options=["Binders","Paper","Storage","Art","Labels","Envelopes","Fasteners","Supplies"];
}

else if(category==="Furniture"){
options=["Chairs","Tables","Bookcases","Furnishings"];
}

else if(category==="Technology"){
options=["Phones","Accessories","Appliances","Machines"];
}

for(var i=0;i<options.length;i++){

var opt=document.createElement("option");

opt.value=options[i];
opt.innerHTML=options[i];

subCategory.appendChild(opt);

}

}

</script>

{% endblock %}
