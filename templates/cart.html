<!DOCTYPE html>
<html>
<head>
<title>Your Cart</title>
</head>

<body>

<h2>Your Cart</h2>

<ul>

{% for item in cart %}

<li>

{{ item }}

<form action="/remove_from_cart" method="POST" style="display:inline;">

</form>

</li>

{% endfor %}

</ul>

<br><br>

<a href="/billing">Proceed to Billing</a>

</body>
</html>
