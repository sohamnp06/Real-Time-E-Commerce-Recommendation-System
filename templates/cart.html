{% extends "layout.html" %}

{% block content %}

<h2>Your Cart</h2>

<table>

<tr>
<th>Product</th>
<th>Price</th>
<th>Quantity</th>
<th>Subtotal</th>
</tr>

{% for item in items %}

<tr>

<td>{{ item.name }}</td>

<td>₹ {{ item.price }}</td>

<td>

<form action="/decrease_quantity" method="POST" style="display:inline">

<input type="hidden" name="product_id" value="{{ item.id }}">

<button>-</button>

</form>

{{ item.qty }}

<form action="/add_to_cart" method="POST" style="display:inline">

<input type="hidden" name="product_id" value="{{ item.id }}">

<button>+</button>

</form>

</td>

<td>₹ {{ item.subtotal }}</td>

</tr>

{% endfor %}

</table>

<h3>Total: ₹ {{ total }}</h3>

{% endblock %}
