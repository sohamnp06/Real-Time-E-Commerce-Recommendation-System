<!DOCTYPE html>
<html>

<head>

<title>Smart Recommendation Store</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<header>

<h1>Smart Recommendation Store</h1>

<div>

<a href="/cart" class="cart-btn">
🛒 Cart (<span id="cart-count">{{ session.get('cart', {}).values() | sum }}</span>)
</a>

<a href="/orders">Orders</a>

<a href="/logout">Logout</a>

</div>

</header>

<div class="container">

{% block content %}
{% endblock %}

</div>


<script>

function addToCart(productId){

fetch("/add_to_cart",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
product_id: productId
})

})

.then(response => response.json())

.then(data => {

document.getElementById("cart-count").innerText = data.cart_count;

});

}

</script>

</body>
</html>
