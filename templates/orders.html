{% extends "layout.html" %}

{% block content %}

<h2>My Orders</h2>

{% if orders|length == 0 %}

<p>You have not placed any orders yet.</p>

{% else %}

<table class="cart-table">

<tr>
<th>Order ID</th>
<th>Date</th>
</tr>

{% for order in orders %}

<tr>
<td>{{ order[0] }}</td>
<td>{{ order[1] }}</td>
</tr>

{% endfor %}

</table>

{% endif %}

{% endblock %}
